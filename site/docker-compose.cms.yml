services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile.brixter
      args:
        BRIXTER_VARIANT: cms
    env_file:
      - .env.cms
    environment:
      BRIXTER_VARIANT: cms
      ORIGIN: ${ORIGIN:-http://localhost:5174}
    ports:
      - '5174:3000'
    volumes:
      - ./data:/app/data
