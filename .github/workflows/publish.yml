name: Publish to npm

on:
  push:
    tags:
      - 'core-v*'
      - 'brixter-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # serve per la provenance
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      # ---- @brixter/core (deve uscire per primo: brixter dipende da lui) ----
      - name: Check @brixter/core version on npm
        id: core_version
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/core/package.json').name")
          LOCAL_VERSION=$(node -p "require('./packages/core/package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)

          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$LOCAL_VERSION is already published on npm"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME will publish $LOCAL_VERSION (npm has ${PUBLISHED_VERSION:-nothing yet})"
          fi

      - run: npm run build:core
        if: steps.core_version.outputs.should_publish == 'true'

      - run: npm publish --workspace=@brixter/core --provenance --access public
        if: steps.core_version.outputs.should_publish == 'true'

      # ---- brixter (dipende da core; esce per secondo) ----
      - name: Check brixter version on npm
        id: brixter_version
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/brixter/package.json').name")
          LOCAL_VERSION=$(node -p "require('./packages/brixter/package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)

          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$LOCAL_VERSION is already published on npm"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME will publish $LOCAL_VERSION (npm has ${PUBLISHED_VERSION:-nothing yet})"
          fi

      - run: npm run build:brixter
        if: steps.brixter_version.outputs.should_publish == 'true'

      - run: npm publish --workspace=brixter --provenance --access public
        if: steps.brixter_version.outputs.should_publish == 'true'